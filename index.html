<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Todo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="todo-app">
        <header class="app-header">
            <div>
                <h1>تطبيق Todo</h1>
                <p>سجل مهامك اليومية واحفظها في المتصفح باستخدام localStorage.</p>
            </div>
        </header>

        <form id="todo-form" class="todo-form">
            <input id="todo-input" type="text" placeholder="أضف مهمة جديدة..." autocomplete="off">
            <button type="submit">إضافة</button>
        </form>

        <div class="todo-controls">
            <button id="clear-all" type="button">مسح الكل</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        <div id="pagination" class="pagination"></div>
        <p id="empty-state" class="empty-state">لا توجد مهام حالياً. أضف المهمة الأولى!</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
